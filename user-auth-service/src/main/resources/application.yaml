spring:
  application:
    name: user-auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/role_based_spring_security}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: user_auth
        hbm2ddl:
          create_namespaces: true
    open-in-view: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha

app:
  jwt:
    # Base64-encoded key (at least 32 decoded bytes). This fallback is for local development only.
    secret: ${JWT_SECRET:eW91ci1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u}
    expiration-ms: ${JWT_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

  default-role-name: ${DEFAULT_ROLE_NAME:ADMIN}
  default-role-description: ${DEFAULT_ROLE_DESCRIPTION:Default user role}
  default-user: ${DEFAULT_USER:admin}
  default-email: ${DEFAULT_EMAIL:admin@example.com}
  default-phone: ${DEFAULT_PHONE:+919876543210}
  default-password: ${DEFAULT_PASSWORD:admin123}
  signup-role-name: ${SIGNUP_ROLE_NAME:USER}
