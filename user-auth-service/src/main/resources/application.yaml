spring:
  application:
    name: user-auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/role_based_spring_security}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: user_auth
        hbm2ddl:
          create_namespaces: true
    open-in-view: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha
